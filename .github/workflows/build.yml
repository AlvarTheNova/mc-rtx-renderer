name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod-jar:
    name: Mod jar (Fabric Loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build mod jar
        run: ./gradlew --no-daemon build
        # No -PwithNative — Linux runner doesn't have the Vulkan SDK installed
        # and the native lib is built by the separate native-lib job below.

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: rtxmc-modjar
          path: build/libs/*.jar
          if-no-files-found: error

  native-lib:
    name: Native lib (Vulkan + Streamline)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.290.0
          cache: true

      # MSVC env (cl.exe on PATH). Version-agnostic so it survives the
      # windows-latest → windows-2025-vs2026 rollout.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        working-directory: native
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: native
        run: cmake --build build

      - name: Upload native lib
        uses: actions/upload-artifact@v4
        with:
          name: rtx_renderer-dll
          # Ninja with single-config CMake puts the output directly in build/
          # (no Release/ subdir like VS multi-config), but our CMakeLists
          # explicitly sets RUNTIME_OUTPUT_DIRECTORY to build/Release.
          path: native/build/Release/rtx_renderer.dll
          if-no-files-found: error
